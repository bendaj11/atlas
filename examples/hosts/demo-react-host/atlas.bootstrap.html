<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo React Host</title>
  </head>
  <body>
    <div id="atlas-host-root">
      <div data-atlas-status data-atlas-loader role="status" aria-label="Loading" style="display:flex;align-items:center;justify-content:center;box-sizing:border-box;position:fixed;inset:0;padding:2rem;opacity:0.6">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" opacity="0.2"/>
          <path d="M22 12a10 10 0 0 0-10-10">
            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
          </path>
        </svg>
      </div>
    </div>
    <script type="module" src="/atlas.loader.js"></script>
  </body>
</html>
